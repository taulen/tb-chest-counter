<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TB Chest Counter - Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Theme before first paint. Mirrors resolveTheme() in lib/theme.js: a saved
    // light / dark / oled wins; anything else ('auto', nothing saved, storage
    // blocked) follows the device, with dark mode painted as OLED. Kept
    // identical across all four HTML shells by tests/config/theme-bootstrap.test.ts.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark' && t !== 'oled') {
        var light = false;
        try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (_) {}
        t = light ? 'light' : 'oled';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    // Language before first paint. A saved non-English choice hides the page
    // until lib/i18n.js has translated it, so English never flashes first;
    // anything else (nothing saved, storage blocked) is English — the default
    // whatever the browser says. Kept identical across the HTML shells by
    // tests/config/i18n-bootstrap.test.ts.
    (function () {
      var l = null;
      try { l = localStorage.getItem('lang'); } catch (_) {}
      if (l === 'es' || l === 'fr' || l === 'ru' || l === 'de') {
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('data-i18n-pending', '');
      }
    })();
  </script>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="login-card">
    <div class="auth-brand">
      <svg class="auth-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 14 C5 8 9 5 16 5 C23 5 27 8 27 14 L27 15 L5 15 Z" fill="#f0c040" stroke="#3d2b0f" stroke-width="1.4" stroke-linejoin="round"/>
        <rect x="5" y="15" width="22" height="12" rx="0.8" fill="#f0c040" stroke="#3d2b0f" stroke-width="1.4" stroke-linejoin="round"/>
        <rect x="5" y="18" width="22" height="2" fill="#3d2b0f"/>
        <rect x="13.5" y="16.8" width="5" height="6.2" rx="0.4" fill="#3d2b0f"/>
        <circle cx="16" cy="19.5" r="0.8" fill="#f0c040"/>
        <rect x="15.65" y="19.5" width="0.7" height="1.6" fill="#f0c040"/>
      </svg>
      <span class="auth-brand-name">TB Chest Counter</span>
    </div>
    <h1 class="auth-title" data-i18n>Sign in to continue</h1>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="username" data-i18n>Username</label>
      <input type="text" id="username" name="username" class="input" autocomplete="username" required autofocus>
      <label for="password" data-i18n>Password</label>
      <input type="password" id="password" name="password" class="input" autocomplete="current-password" required>
      <button type="submit" class="btn" data-i18n>Sign In</button>
    </form>
    <!-- New accounts come from a code the clan's scanner account sends in the
         game chat (docs/account-invites.md); so does a forgotten password.
         The chat message can't carry a link (the game blocks them), so it
         names the site and this button: keep the English label in step with
         JOIN_ENTRY_LABEL in src/scheduler/chat-invites.ts. -->
    <div class="login-join">
      <a class="btn btn-secondary login-join-btn" href="/join" data-i18n>Have a code? Join here</a>
      <p class="login-join-hint" data-i18n>No account or forgot your password? Send the word code to your clan's tracker account in the game chat.</p>
    </div>
    <!-- Filled by login.js from /api/public/boards; stays hidden when no clan
         has a live share link (or the call fails). -->
    <nav class="login-boards" id="publicBoards" aria-labelledby="publicBoardsTitle" hidden>
      <h2 class="login-boards-title" id="publicBoardsTitle" data-i18n>Public boards</h2>
      <p class="login-boards-hint" data-i18n>Clan leaderboards anyone can view, no account needed.</p>
      <ul class="login-boards-list" id="publicBoardsList"></ul>
    </nav>
    <div class="login-lang">
      <select class="lang-select" data-lang-select aria-label="Language" data-i18n-attr="aria-label"></select>
    </div>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
