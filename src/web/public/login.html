<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TB Chest Counter - Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Theme before first paint. Mirrors resolveTheme() in lib/theme.js: a saved
    // light / dark / oled wins; anything else ('auto', nothing saved, storage
    // blocked) follows the device, with dark mode painted as OLED. Kept
    // identical across all four HTML shells by tests/config/theme-bootstrap.test.ts.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark' && t !== 'oled') {
        var light = false;
        try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (_) {}
        t = light ? 'light' : 'oled';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    // Language before first paint. A saved non-English choice hides the page
    // until lib/i18n.js has translated it, so English never flashes first;
    // anything else (nothing saved, storage blocked) is English — the default
    // whatever the browser says. Kept identical across the HTML shells by
    // tests/config/i18n-bootstrap.test.ts.
    (function () {
      var l = null;
      try { l = localStorage.getItem('lang'); } catch (_) {}
      if (l === 'es' || l === 'fr' || l === 'ru' || l === 'de') {
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('data-i18n-pending', '');
      }
    })();
  </script>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="login-card">
    <h1>TB Chest Counter</h1>
    <p class="subtitle" data-i18n>Sign in to continue</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="username" data-i18n>Username</label>
      <input type="text" id="username" name="username" class="input" autocomplete="username" required autofocus>
      <label for="password" data-i18n>Password</label>
      <input type="password" id="password" name="password" class="input" autocomplete="current-password" required>
      <button type="submit" class="btn" data-i18n>Sign In</button>
    </form>
    <div class="login-lang">
      <select class="lang-select" data-lang-select aria-label="Language" data-i18n-attr="aria-label"></select>
    </div>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
