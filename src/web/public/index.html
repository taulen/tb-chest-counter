<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TB Chest Counter</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Apply the user's saved theme synchronously before the stylesheet
       paints so the page never flashes the wrong palette on reload.
       App.js will rewrite this once /auth/me returns the server-stored
       preference (which may differ from this browser's last choice). -->
  <script>
    // Theme before first paint. Mirrors resolveTheme() in lib/theme.js: a saved
    // light / dark / oled wins; anything else ('auto', nothing saved, storage
    // blocked) follows the device, with dark mode painted as OLED. Kept
    // identical across all four HTML shells by tests/config/theme-bootstrap.test.ts.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (_) {}
      if (t !== 'light' && t !== 'dark' && t !== 'oled') {
        var light = false;
        try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (_) {}
        t = light ? 'light' : 'oled';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    // Language before first paint. A saved non-English choice hides the page
    // until lib/i18n.js has translated it, so English never flashes first;
    // anything else (nothing saved, storage blocked) is English — the default
    // whatever the browser says. Kept identical across the HTML shells by
    // tests/config/i18n-bootstrap.test.ts.
    (function () {
      var l = null;
      try { l = localStorage.getItem('lang'); } catch (_) {}
      if (l === 'es' || l === 'fr' || l === 'ru' || l === 'de') {
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('data-i18n-pending', '');
      }
    })();
  </script>
  <script>
    // The sidebar's width before first paint, so a desktop folded to the icon
    // rail never flashes the full menu. Desktop (≥1100px) follows this
    // browser's choice; the tablet width is always the rail. lib/shell.js keeps
    // the attribute current from here on (resizes, the fold button).
    (function () {
      var rail = false;
      try { rail = localStorage.getItem('navRail') === '1'; } catch (_) {}
      if (window.innerWidth < 1100) rail = true;
      document.documentElement.setAttribute('data-nav', rail ? 'rail' : 'full');
    })();
  </script>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/external.css">
  <!-- Served from the installed chart.js package (see /vendor route), not a
       CDN: a self-hosted tool should not need a third party to be up, and the
       CSP would otherwise have to allow an external script origin. -->
  <script src="/vendor/chart.umd.js"></script>
</head>

       One sidebar, three layouts:
         ≥1100px  the full sidebar, which folds to an icon rail (remembered
                  per browser);
         641–1099 the icon rail, unfolding over the page;
         ≤640px   a bottom tab bar, whose More opens this same sidebar as a
                  sheet — so every control exists once and every id app.js
                  looks up stays unique. -->

          <rect x="13.5" y="16.8" width="5" height="6.2" rx="0.4" fill="#3d2b0f"/>

        <svg class="nav-icon shell-fold-out" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 17 5-5-5-5"/><path d="m6 17 5-5-5-5"/></svg>

    <!-- The scanner, always in view. Everyone sees its state and the next
         scan; only a superadmin gets the buttons (app.js). While a scan runs
         the scan card (lib/scan-card.js) stands in for the state line. -->

        <span id="statusText" class="shell-scanner-text is-loading" data-i18n>Loading...</span>

      </div>
      <div class="shell-next-scan" id="nextScan"></div>
      <div class="scan-card" data-scan-card></div>
      <div class="scan-controls is-hidden" data-scan-controls>
        <button class="btn btn-sm btn-primary" type="button" data-action="trigger-scan" data-scope="clan">

        <a href="#" data-page="chats"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg><span class="nav-label" data-i18n>Chats</span></a>

        <a href="#" data-page="tools"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M16 14v4"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg><span class="nav-label" data-i18n>Tools</span></a>
        <a href="#" data-page="chest-rewards"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C9.6 3 11.2 5.3 12 8c.8-2.7 2.4-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><span class="nav-label" data-i18n>Chest rewards</span></a>
        <a href="#" data-page="resources"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span class="nav-label" data-i18n>Resources</span></a>
        <a href="#" data-page="sessions"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span class="nav-label" data-i18n>Scan History</span></a>

      </div>
      <div class="nav-group">
        <div class="nav-group-label" data-i18n>Manage</div>
        <a href="#" data-page="admin" id="navAdmin" class="is-hidden"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span class="nav-label" data-i18n>Admin</span><span id="navAdminDot" class="nav-dot is-hidden"><span class="visually-hidden" data-i18n> (items need review)</span></span></a>
        <a href="#" data-page="users" id="navUsers" class="is-hidden"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="nav-label" data-i18n>Users</span></a>

      </div>

    <!-- The account, at the foot. Desktop: a button opening a menu above it.
         Phone sheet: the same menu laid out inline. -->
    <div class="shell-account" id="userInfo">
      <button id="userMenuBtn" class="shell-account-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
        <span class="shell-avatar" id="userInitial" aria-hidden="true"></span>
        <span class="shell-account-text">
          <span id="userName" class="shell-account-name"></span>
          <span id="userRole" class="shell-account-role"></span>
        </span>

          <div class="shell-account-who-row">
            <span class="shell-avatar" id="userMenuAvatar" aria-hidden="true"></span>
            <div class="shell-account-who" id="userMenuWho"></div>
          </div>
        </div>
        <!-- Alts (v130): which of the account's players in the clan being viewed
             it plays as — its picture is the account's here. Shown only when the
             account has more than one player in this clan (lib/shell.js). -->

          <label class="user-menu-section-label" for="userMenuPlayingSelect" data-i18n>Playing as</label>
          <select id="userMenuPlayingSelect" class="lang-select"></select>
        </div>
        <div class="user-menu-section">
          <div class="user-menu-section-label" data-i18n>Theme</div>
          <div class="theme-segmented" role="group" aria-label="Color theme" data-i18n-attr="aria-label">
            <button class="theme-segmented-btn" data-action="set-theme" data-theme="auto" type="button" title="Follow your device: Light in light mode, OLED in dark mode" data-i18n data-i18n-attr="title">Auto</button>
            <button class="theme-segmented-btn" data-action="set-theme" data-theme="light" type="button" data-i18n>Light</button>
            <button class="theme-segmented-btn" data-action="set-theme" data-theme="dark" type="button" data-i18n>Dark</button>
            <button class="theme-segmented-btn" data-action="set-theme" data-theme="oled" type="button">OLED</button>
          </div>
        </div>
        <div class="user-menu-section">
          <label class="user-menu-section-label" for="userMenuLanguage" data-i18n>Language</label>
          <select id="userMenuLanguage" class="lang-select" data-lang-select></select>
        </div>
        <div class="user-menu-divider" role="separator"></div>
        <button class="user-menu-item" type="button" data-action="open-avatar-editor" data-i18n>Change photo</button>
        <!-- Signed in, a code from another clan's tracker adds that clan to this
             account (or links an old account): lib/add-clan.js, inside the app.
             Signed out, the sign-in page's "Have a code? Join here" opens /join.

        <button class="user-menu-item" type="button" data-action="open-add-clan" id="userMenuAddClan" data-i18n>Add a clan with a code</button>

  </footer>

  <!-- Rail tooltips (lib/shell.js): one element, placed beside whatever is
       hovered or focused, because the scrolling rail would clip its own. -->
  <div class="shell-tip" id="shellTip" aria-hidden="true" hidden></div>

  <!-- app.js loads external.js transitively via its `import { renderExternal }`.
       Keeping the entry point a single module script is enough — the
       browser deduplicates and resolves dependencies in order. -->
  <script type="module" src="/app.js"></script>
</body>
</html>
